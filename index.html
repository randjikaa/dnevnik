<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eDnevnik — Prijava</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <h1>eDnevnik</h1>
    </div>
    <div class="auth-sub">Elektronski dnevnik za škole</div>

    <div class="form-group">
      <label>Korisničko ime</label>
      <input type="text" id="loginUser" placeholder="ime.prezime" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Lozinka</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-primary" onclick="doLogin()">Prijavi se</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.26.0/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
async function doLogin() {
  const userInput = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('authMsg');
  msg.textContent = 'Prijavljujem...';
  msg.className = 'auth-msg';

  if (!userInput || !pass) {
    msg.textContent = 'Unesite korisničko ime i lozinku.';
    msg.className = 'auth-msg err';
    return;
  }

  // Look up email from usernames table
  const SB_URL2 = 'https://kdxwgeocimmdfemwqnty.supabase.co';
  const SB_KEY2 = 'sb_publishable_NSRd-Sq4PlVHNztHDsvXNA_kLHza0HN';
  const r = await fetch(`${SB_URL2}/rest/v1/usernames?username=eq.${encodeURIComponent(userInput)}&select=email`, {
    headers: { 'apikey': SB_KEY2, 'Content-Type': 'application/json' }
  });
  const unData = await r.json();
  
  if (!unData.length || !unData[0].email) {
    msg.textContent = 'Korisničko ime ne postoji.';
    msg.className = 'auth-msg err';
    return;
  }

  const email = unData[0].email;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    msg.textContent = 'Pogrešna lozinka.';
    msg.className = 'auth-msg err';
    return;
  }

  // Load profile to determine role
  const user = await getSession();
  if (!user) { msg.textContent = 'Greška.'; msg.className = 'auth-msg err'; return; }
  const profile = await loadProfile(user.id);

  if (!profile) {
    msg.textContent = 'Nalog nije podešen. Kontaktirajte administratora.';
    msg.className = 'auth-msg err';
    return;
  }

  // Redirect based on role
  const routes = {
    admin: 'admin.html',
    nastavnik: 'nastavnik.html',
    strucna_sluzba: 'strucna.html',
    staresina: 'staresina.html',
    ucenik: 'ucenik.html',
    roditelj: 'roditelj.html'
  };
  window.location.href = routes[profile.role] || 'admin.html';
}

document.addEventListener('DOMContentLoaded', async () => {
  // If already logged in, redirect
  const user = await getSession();
  if (user) {
    const profile = await loadProfile(user.id);
    if (profile) {
      const routes = { admin: 'admin.html', nastavnik: 'nastavnik.html', strucna_sluzba: 'strucna.html', staresina: 'staresina.html', ucenik: 'ucenik.html', roditelj: 'roditelj.html' };
      window.location.href = routes[profile.role] || 'admin.html';
    }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
